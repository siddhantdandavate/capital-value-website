<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Capital Value Mortgage Consulting</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
      background: var(--navy-deep);
      color: var(--text-white);
    }
    .error-code {
      font-size: clamp(5rem, 12vw, 8rem);
      font-weight: 800;
      color: var(--gold-light);
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -0.04em;
    }
    .error-title {
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      font-weight: 700;
      margin-bottom: 16px;
    }
    .error-desc {
      color: var(--text-light-muted);
      max-width: 500px;
      margin: 0 auto 32px auto;
      font-size: 1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="error-page-wrapper">
    <a href="index.html" style="margin-bottom: 32px;">
      <img src="logo.png" alt="Capital Value Logo" style="height: 56px; width: auto;">
    </a>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Located</h1>
    <p class="error-desc">
      The requested page could not be found or may have moved. Please return to the homepage to explore our UAE mortgage advisory solutions.
    </p>
    <a href="index.html" class="btn btn-primary">Return to Homepage</a>
  </div>
</body>
</html>
